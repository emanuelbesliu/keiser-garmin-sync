[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keiser-garmin-sync"
version = "1.0.0"
description = "Sync Keiser M Series indoor cycling rides to Garmin Connect (cloud-to-cloud, no bridge apps)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "keiser-garmin-sync contributors" }]
keywords = ["keiser", "garmin", "cycling", "fitness", "tcx", "sync", "indoor-cycling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "garminconnect>=0.2.25",
    "garth>=0.5.17",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
keiser-garmin-sync = "keiser_garmin_sync.cli:main"

[project.urls]
Homepage = "https://github.com/emanuelbesliu/keiser-garmin-sync"
Repository = "https://github.com/emanuelbesliu/keiser-garmin-sync"
Issues = "https://github.com/emanuelbesliu/keiser-garmin-sync/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/keiser_garmin_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends-style defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
