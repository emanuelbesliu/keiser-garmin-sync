# EXAMPLE ONLY — do not commit real values. Prefer a secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: keiser-garmin-sync-credentials
type: Opaque
stringData:
  KEISER_EMAIL: "you@example.com"
  KEISER_PASSWORD: "your-keiser-password"
  # Seed with `keiser-garmin-sync login` and paste the printed value here:
  GARMIN_TOKEN_BASE64: ""
  # Fallback (fails under Garmin MFA):
  # GARMIN_EMAIL: ""
  # GARMIN_PASSWORD: ""
